behaviors:
  shootingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.0e-4
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
      memory:
        sequence_length: 64
        memory_size: 256
    reward_signals:
      extrinsic:
        strength: 1.0
        gamma: 0.99
      # curiosity:
      #   strength: 0.2
      #   gamma: 0.99
      #   encoding_size: 256
    keep_checkpoints: 5
    ##rotation Part
    checkpoint_interval: 100000
    max_steps: 5000000
    time_horizon: 64
    summary_freq: 10000

