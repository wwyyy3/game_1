behaviors:
  shootingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 1.0e-5
      beta: 2e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
      memory:
        sequence_length: 64
        memory_size: 256
    reward_signals:
      extrinsic:
        strength: 1.0
        gamma: 0.99
      # curiosity:
      #   strength: 0.2
      #   gamma: 0.99
      #   encoding_size: 256
    keep_checkpoints: 5
    #rotation Part
    # checkpoint_interval: 2000000
    # max_steps: 8000000
    # time_horizon: 64
    # summary_freq: 1000

    #final Part
    # checkpoint_interval: 2000000
    # max_steps: 10000000
    # time_horizon: 64
    # summary_freq: 8000

    #pathFinding Part
    checkpoint_interval: 100000
    max_steps: 5000000
    time_horizon: 64
    summary_freq: 10000
