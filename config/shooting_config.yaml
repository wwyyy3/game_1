behaviors:
  shootingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.0e-4
      beta: 0.1
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 3
      vis_encode_type: simple
      memory:
        sequence_length: 64
        memory_size: 256
    reward_signals:
      extrinsic:
        strength: 1.0
        gamma: 0.99
      curiosity:
        strength: 0.02
        gamma: 0.99
        encoding_size: 128
    keep_checkpoints: 5
    #rotation Part
    # checkpoint_interval: 2000000
    # max_steps: 8000000
    # time_horizon: 64
    # summary_freq: 1000

    #final Part
    # checkpoint_interval: 4000000
    # max_steps: 16000000
    # time_horizon: 64
    # summary_freq: 100000

    #pathFinding Part
    checkpoint_interval: 200000
    max_steps: 8000000
    time_horizon: 64
    summary_freq: 10000

